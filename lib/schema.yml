---
type: object
properties:
  name:
    type: string
    description: The entity name at singular, in snake case and in english
    not:
      enum: <%= Tenant
        .schema
        .entities
        .select(&:core?)
        .map(&:name)
        .concat(Schematics::Entities::Entity::NAME_DENYLIST) %>
  options:
    type: object
    properties:
      descriptor:
        type: string
        description: The attribute name which represents the most the entity
      icon:
        type: string
        description: An icon which represents the entity
        enum: <%= Schematics::Options::Icon.collection.map(&:to_s) %>
    additionalProperties: false
    required:
      - descriptor
      - icon
  associations:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
          description: The association type
          enum:
            - has_and_belongs_to_many
        name:
          type: string
          description: The has and belongs to many association name at plural, in snake case and in english
      additionalProperties: false
      required:
        - type
        - name
  attributes:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
          description: The attribute name in snake case, in english and without id suffix
          not:
            enum: <%= ActiveRecord::AttributeMethods
              .dangerous_attribute_methods
              .dup
              .merge(Schematics::Behaviours::Nameable::NAME_DENYLIST)
              .merge(Schematics::Trackable::DENYLIST)
              .to_a
              .map(&:to_s) %>
        type:
          type: string
          description: The attribute type
          enum: <%= Schematics::Attributes::Attribute.collection.map(&:type) %>
        options:
          type: object
          properties:
            required:
              type: boolean
              description: Is the attribute required or not
              enum:
                - true
                - false
          additionalProperties: false
          required:
            - required
      additionalProperties: false
      required:
        - name
        - type
        - options
additionalProperties: false
required:
  - name
  - options
  - associations
  - attributes
