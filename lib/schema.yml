---
type: object
properties:
  name:
    type: string
    description: |
      The unique entity name at singular, in snake case and in english.
      The name must not be among <%= Schematics::Schema
        .new
        .entities
        .map(&:name)
        .concat(Schematics::Entities::Entity::NAME_DENYLIST)
        .to_sentence %>
  options:
    type: object
    properties:
      descriptor:
        type: string
        description: The attribute name which represents the most the entity
      icon:
        $ref: '#/$defs/icon'
    additionalProperties: false
    required:
      - descriptor
      - icon
  # associations:
  #   type: array
  #   items:
  #     type: object
  #     properties:
  #       type:
  #         type: string
  #         description: The association type
  #         enum:
  #           - has_and_belongs_to_many
  #       name:
  #         type: string
  #         description: The unique many-to-many association name at plural, in snake case and in english
  #     additionalProperties: false
  #     required:
  #       - type
  #       - name
  attributes:
    type: array
    items:
      anyOf:
        - $ref: '#/$defs/address'
        - $ref: '#/$defs/array'
        - $ref: '#/$defs/attachment'
        - $ref: '#/$defs/attachments'
        - $ref: '#/$defs/belongs_to'
        - $ref: '#/$defs/boolean'
        - $ref: '#/$defs/byte'
        - $ref: '#/$defs/code'
        - $ref: '#/$defs/color'
        - $ref: '#/$defs/country'
        - $ref: '#/$defs/currency'
        - $ref: '#/$defs/date'
        - $ref: '#/$defs/datetime'
        - $ref: '#/$defs/decimal'
        - $ref: '#/$defs/digest'
        - $ref: '#/$defs/duration'
        - $ref: '#/$defs/email'
        - $ref: '#/$defs/enum'
        - $ref: '#/$defs/flag'
        - $ref: '#/$defs/float'
        - $ref: '#/$defs/integer'
        - $ref: '#/$defs/ip'
        - $ref: '#/$defs/jsonb'
        - $ref: '#/$defs/mime'
        - $ref: '#/$defs/one_time_password'
        - $ref: '#/$defs/percentage'
        - $ref: '#/$defs/phone'
        - $ref: '#/$defs/rating'
        - $ref: '#/$defs/response_code'
        - $ref: '#/$defs/rich_text'
        - $ref: '#/$defs/secret'
        - $ref: '#/$defs/state_machine'
        - $ref: '#/$defs/string'
        - $ref: '#/$defs/text'
        - $ref: '#/$defs/time'
        - $ref: '#/$defs/time_zone'
        - $ref: '#/$defs/token'
        - $ref: '#/$defs/url'
        - $ref: '#/$defs/user'
        - $ref: '#/$defs/user_agent'
$defs:
  acceptance:
    type: object
    additionalProperties: false
    required:
      - acceptance
    properties:
      acceptance:
        type: boolean
        description: Is the attribute must be accepted or not
  aspect_ratio:
    type: object
    additionalProperties: false
    required:
      - aspect_ratio
    properties:
      aspect_ratio:
        type: array
        description: The aspect ratios of the image
        items:
          type: string
          enum: <%= Schematics::Options::AspectRatio.collection.map(&:second) %>
  auto_increment:
    type: object
    additionalProperties: false
    required:
      - auto_increment
    properties:
      auto_increment:
        type: boolean
        description: Is the number auto incrementable or not
  case_insensitive:
    type: object
    additionalProperties: false
    required:
      - case_insensitive
    properties:
      case_insensitive:
        type: boolean
        description: Is the string case insensitive or not
  confirm:
    type: object
    additionalProperties: false
    required:
      - confirm
    properties:
      confirm:
        type: boolean
        description: Has the password to be confirmed or not
  content_type:
    type: object
    additionalProperties: false
    required:
      - content_type
    properties:
      content_type:
        type: array
        description: The content types of the attachment
        items:
          type: string
          enum: <%= Schematics::Options::ContentType.collection %>
  equal_to:
    type: object
    additionalProperties: false
    required:
      - equal_to
    properties:
      equal_to:
        type: number
        description: The number should be equal to
  events:
    type: object
    additionalProperties: false
    required:
      - events
    properties:
      events:
        type: array
        items:
          type: object
          properties:
            name:
              $ref: '#/$defs/name'
            icon:
              $ref: '#/$defs/icon'
            color:
              type: string
              description: The event style
              enum: <%= Schematics::Options::StateMachineEvent::COLORS.map(&:to_s) %>
            confirm:
              type: boolean
              description: Does the event action need to be confirmed
            from:
              type: string
              description: The starting value of the event transition
            to:
              type: string
              description: The ending value of the event transition
          additionalProperties: false
          required:
            - name
            - icon
            - color
            - confirm
            - from
            - to
  greater_than_or_equal_to:
    type: object
    additionalProperties: false
    required:
      - greater_than_or_equal_to
    properties:
      greater_than_or_equal_to:
        type: number
        description: The number should be greater than or equal to
  greater_than:
    type: object
    additionalProperties: false
    required:
      - greater_than
    properties:
      greater_than:
        type: number
        description: The number should be greater than
  height:
    type: object
    additionalProperties: false
    required:
      - height
    properties:
      height:
        type: number
        description: The height of the image in pixels
  inverse_association_type:
    type: object
    additionalProperties: false
    required:
      - inverse_association_type
    properties:
      inverse_association_type:
        type: string
        description: The inverse type of the association
        enum: <%= Schematics::Options::InverseAssociationType.collection.map(&:second) %>
  language:
    type: object
    additionalProperties: false
    required:
      - language
    properties:
      language:
        type: string
        description: The language of the code editor
        enum: <%= Schematics::Options::Language.collection %>
  length:
    type: object
    additionalProperties: false
    required:
      - length
    properties:
      length:
        type: number
        description: The exact length of the text
  less_than_or_equal_to:
    type: object
    additionalProperties: false
    required:
      - less_than_or_equal_to
    properties:
      less_than_or_equal_to:
        type: number
        description: The number should be less than or equal to
  less_than:
    type: object
    additionalProperties: false
    required:
      - less_than
    properties:
      less_than:
        type: number
        description: The number should be less than
  limit:
    type: object
    additionalProperties: false
    required:
      - limit
    properties:
      limit:
        type: number
        description: The maximum length of the text
  max:
    type: object
    additionalProperties: false
    required:
      - max
    properties:
      max:
        type: number
        description: The maximum number of attachments
  min:
    type: object
    additionalProperties: false
    required:
      - min
    properties:
      min:
        type: number
        description: The minimum length of the text
  normalization:
    type: object
    additionalProperties: false
    required:
      - normalization
    properties:
      normalization:
        type: string
        description: The text formatting
        enum: <%= Schematics::Options::Normalization.collection.map(&:second) %>
  other_than:
    type: object
    additionalProperties: false
    required:
      - other_than
    properties:
      other_than:
        type: number
        description: The number should be other than
  precision:
    type: object
    additionalProperties: false
    required:
      - precision
    properties:
      precision:
        type: number
        descripion: The number of digits in the number
  readonly:
    type: object
    additionalProperties: false
    required:
      - readonly
    properties:
      readonly:
        type: boolean
        description: Is the attribute readonly or not
  required:
    type: object
    additionalProperties: false
    required:
      - required
    properties:
      required:
        type: boolean
        description: Is the attribute required or not
  scale:
    type: object
    additionalProperties: false
    required:
      - scale
    properties:
      scale:
        type: number
        description: The number of digits following the decimal point in the number
  schemes:
    type: object
    additionalProperties: false
    required:
      - schemes
    properties:
      schemes:
        type: array
        description: The URL schemes
        items:
          type: string
          enum: <%= Schematics::Options::Schemes.collection %>
  separator:
    type: object
    additionalProperties: false
    required:
      - separator
    properties:
      separator:
        type: string
        description: The number separator
        enum: <%= Schematics::Options::Separator.collection %>
  size:
    type: object
    additionalProperties: false
    required:
      - size
    properties:
      size:
        type: number
        description: The maximum size of the attachment in megabytes
  translated:
    type: object
    additionalProperties: false
    required:
      - translated
    properties:
      translated:
        type: boolean
        description: Is the text translated or not
  unique:
    type: object
    additionalProperties: false
    required:
      - unique
    properties:
      unique:
        type: boolean
        description: Is the text unique or not
  unit:
    type: object
    additionalProperties: false
    required:
      - unit
    properties:
      unit:
        type: string
        description: The number unit
  values:
    type: object
    additionalProperties: false
    required:
      - values
    properties:
      values:
        type: array
        description: The enumeration values
        items:
          type: string
  width:
    type: object
    additionalProperties: false
    required:
      - width
    properties:
      width:
        type: number
        description: The width of the image in pixels
  icon:
    type: string
    description: An icon which represents the entity or event
    enum: <%= Schematics::Options::Icon.collection.map(&:to_s).sample(250) %>
  name:
    type: string
    description: |
      The name is unique, in snake case, in english and without id suffix.
      The name must not be among <%= ActiveRecord::AttributeMethods
        .dangerous_attribute_methods
        .dup
        .merge(Schematics::Behaviours::Nameable::NAME_DENYLIST)
        .merge(Schematics::Trackable::DENYLIST)
        .to_a
        .map(&:to_s)
        .to_sentence %>
  address:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a postal address
        enum:
          - address
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/unique'
          - $ref: '#/$defs/case_insensitive'
          - $ref: '#/$defs/min'
          - $ref: '#/$defs/limit'
          - $ref: '#/$defs/length'
          - $ref: '#/$defs/normalization'
        additionalProperties: false
  array:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents an array of values
        enum:
          - array
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
        additionalProperties: false
  attachment:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents an attachment
        enum:
          - attachment
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/size'
          - $ref: '#/$defs/aspect_ratio'
          - $ref: '#/$defs/width'
          - $ref: '#/$defs/height'
          - $ref: '#/$defs/content_type'
        additionalProperties: false
  attachments:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a set of attachments
        enum:
          - attachments
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/size'
          - $ref: '#/$defs/aspect_ratio'
          - $ref: '#/$defs/min'
          - $ref: '#/$defs/max'
          - $ref: '#/$defs/width'
          - $ref: '#/$defs/height'
          - $ref: '#/$defs/content_type'
        additionalProperties: false
  belongs_to:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: A one-to-many association
        enum:
          - belongs_to
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/inverse_association_type'
        additionalProperties: false
  boolean:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a boolean
        enum:
          - boolean
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/acceptance'
        additionalProperties: false
  byte:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a byte
        enum:
          - byte
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/greater_than'
          - $ref: '#/$defs/greater_than_or_equal_to'
          - $ref: '#/$defs/equal_to'
          - $ref: '#/$defs/less_than'
          - $ref: '#/$defs/less_than_or_equal_to'
          - $ref: '#/$defs/other_than'
          - $ref: '#/$defs/precision'
          - $ref: '#/$defs/separator'
        additionalProperties: false
  code:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a source code
        enum:
          - code
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/translated'
          - $ref: '#/$defs/min'
          - $ref: '#/$defs/limit'
          - $ref: '#/$defs/length'
          - $ref: '#/$defs/language'
        additionalProperties: false
  color:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents an hexadecimal color
        enum:
          - color
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/unique'
          - $ref: '#/$defs/case_insensitive'
          - $ref: '#/$defs/min'
          - $ref: '#/$defs/limit'
          - $ref: '#/$defs/length'
        additionalProperties: false
  country:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a country name
        enum:
          - country
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/unique'
          - $ref: '#/$defs/case_insensitive'
        additionalProperties: false
  currency:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a currency symbol
        enum:
          - currency
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/greater_than'
          - $ref: '#/$defs/greater_than_or_equal_to'
          - $ref: '#/$defs/equal_to'
          - $ref: '#/$defs/less_than'
          - $ref: '#/$defs/less_than_or_equal_to'
          - $ref: '#/$defs/other_than'
          - $ref: '#/$defs/unit'
          - $ref: '#/$defs/precision'
          - $ref: '#/$defs/separator'
        additionalProperties: false
  date:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a date without time
        enum:
          - date
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/greater_than'
          - $ref: '#/$defs/greater_than_or_equal_to'
          - $ref: '#/$defs/equal_to'
          - $ref: '#/$defs/less_than'
          - $ref: '#/$defs/less_than_or_equal_to'
          - $ref: '#/$defs/other_than'
        additionalProperties: false
  datetime:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a date with a time
        enum:
          - datetime
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/greater_than'
          - $ref: '#/$defs/greater_than_or_equal_to'
          - $ref: '#/$defs/equal_to'
          - $ref: '#/$defs/less_than'
          - $ref: '#/$defs/less_than_or_equal_to'
          - $ref: '#/$defs/other_than'
        additionalProperties: false
  decimal:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a decimal
        enum:
          - decimal
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/greater_than'
          - $ref: '#/$defs/greater_than_or_equal_to'
          - $ref: '#/$defs/equal_to'
          - $ref: '#/$defs/less_than'
          - $ref: '#/$defs/less_than_or_equal_to'
          - $ref: '#/$defs/other_than'
          - $ref: '#/$defs/unit'
          - $ref: '#/$defs/precision'
          - $ref: '#/$defs/separator'
          - $ref: '#/$defs/scale'
          - $ref: '#/$defs/auto_increment'
        additionalProperties: false
  digest:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a password
        enum:
          - digest
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/confirm'
          - $ref: '#/$defs/min'
        additionalProperties: false
  duration:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a duration
        enum:
          - duration
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/greater_than'
          - $ref: '#/$defs/greater_than_or_equal_to'
          - $ref: '#/$defs/equal_to'
          - $ref: '#/$defs/less_than'
          - $ref: '#/$defs/less_than_or_equal_to'
          - $ref: '#/$defs/other_than'
          - $ref: '#/$defs/unit'
        additionalProperties: false
  email:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents an email address
        enum:
          - email
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/unique'
          - $ref: '#/$defs/min'
          - $ref: '#/$defs/limit'
          - $ref: '#/$defs/length'
        additionalProperties: false
  enum:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents an enumeration
        enum:
          - enum
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/values'
        additionalProperties: false
  flag:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents an enumeration with multiple choices
        enum:
          - flag
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/values'
        additionalProperties: false
  float:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents a float number
        enum:
          - float
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/greater_than'
          - $ref: '#/$defs/greater_than_or_equal_to'
          - $ref: '#/$defs/equal_to'
          - $ref: '#/$defs/less_than'
          - $ref: '#/$defs/less_than_or_equal_to'
          - $ref: '#/$defs/other_than'
          - $ref: '#/$defs/unit'
          - $ref: '#/$defs/precision'
          - $ref: '#/$defs/separator'
          - $ref: '#/$defs/auto_increment'
        additionalProperties: false
  integer:
    type: object
    additionalProperties: false
    required:
      - name
      - type
      - options
    properties:
      type:
        type: string
        description: An attribute which represents an integer
        enum:
          - integer
      name:
        $ref: '#/$defs/name'
      options:
        type: object
        anyOf:
          - $ref: '#/$defs/required'
          - $ref: '#/$defs/readonly'
          - $ref: '#/$defs/greater_than'
          - $ref: '#/$defs/greater_than_or_equal_to'
          - $ref: '#/$defs/equal_to'
