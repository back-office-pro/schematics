---
data:
  read:
    - config/locales/**/%{locale}.yml
  yaml:
    write:
      line_width: -1
search:
  paths:
    - app/
    - lib/
  relative_roots:
    - app/components
    - app/controllers
    - app/interactors
    - app/helpers
    - app/mailers
    - app/views
  exclude:
    - app/interactors/schematics/imports
ignore_missing:
  - activerecord.*
  - routes.*
  - simple_form.*
  - titles.*
  - errors.*
  - attributes.*
  - schematics.*
  - sessions.*
  - javascript.*
  - pagy.*
  - date.*
  - time.*
  - i18n.inflections.gender.*
  - 'true'
  - 'false'
  - line
  - by
  - of
ignore_unused:
  - activerecord.*
  - routes.*
  - simple_form.*
  - titles.*
  - errors.*
  - attributes.*
  - schematics.*
  - sessions.*
  - javascript.*
  - pagy.*
  - date.*
  - time.*
  - i18n.inflections.gender.*
  - 'true'
  - 'false'
  - line
  - by
  - of
