default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>
  timeout: 5_000

development:
  primary:
    <<: *default
    database: storage/<%= Tenant.database_name %>/development.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/migrate
  search:
    <<: *default
    database: storage/<%= Tenant.database_name %>/development_search.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/search_migrate
  cable:
    <<: *default
    database: storage/<%= Tenant.database_name %>/development_cable.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/cable_migrate
  cache:
    <<: *default
    database: storage/<%= Tenant.database_name %>/development_cache.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/cache_migrate
  queue:
    <<: *default
    database: storage/<%= Tenant.database_name %>/development_queue.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/queue_migrate

test:
  primary:
    <<: *default
    database: storage/<%= Tenant.database_name %>/test.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/migrate
  search:
    <<: *default
    database: storage/<%= Tenant.database_name %>/test_search.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/search_migrate

production: &production
  primary:
    <<: *default
    database: storage/<%= Tenant.database_name %>/production.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/migrate
  search:
    <<: *default
    database: storage/<%= Tenant.database_name %>/production_search.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/search_migrate
  cable:
    <<: *default
    database: storage/<%= Tenant.database_name %>/production_cable.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/cable_migrate
  cache:
    <<: *default
    database: storage/<%= Tenant.database_name %>/production_cache.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/cache_migrate
  queue:
    <<: *default
    database: storage/<%= Tenant.database_name %>/production_queue.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/queue_migrate

on_premise:
  <<: *production
