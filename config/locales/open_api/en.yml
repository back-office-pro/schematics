        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: JWT
    api_key:
      type: apiKey
      name: x-api-key
      in: header
