    <<: *sqlite3
    database: storage/<%= Tenant.database_name %>/test.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/migrate
  search:
    <<: *sqlite3
    database: storage/<%= Tenant.database_name %>/test_search.sqlite3
    migrations_paths: db/<%= Tenant.database_name %>/search_migrate

