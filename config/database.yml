postgresql: &postgresql
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>
  connect_timeout: 1
  checkout_timeout: 1
  variables:
    statement_timeout: <%= ENV.fetch('STATEMENT_TIMEOUT', '5s') %>

sqlite3: &sqlite3
  adapter: sqlite3
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *postgresql
    database: <%= ENV['DATABASE'] %>_development
    migrations_paths: db/<%= ENV['DATABASE'] %>/migrate
  search:
    <<: *sqlite3
    database: storage/<%= ENV['DATABASE'] %>/development_search.sqlite3
    migrations_paths: db/<%= ENV['DATABASE'] %>/search_migrate
  cable:
    <<: *postgresql
    database: development_cable
    migrations_paths: db/cable_migrate
  cache:
    <<: *sqlite3
    database: storage/<%= ENV['DATABASE'] %>/development_cache.sqlite3
    migrations_paths: db/<%= ENV['DATABASE'] %>/cache_migrate
  queue:
    <<: *postgresql
    database: development_queue
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *sqlite3
    database: storage/<%= ENV['DATABASE'] %>/test.sqlite3
    migrations_paths: db/<%= ENV['DATABASE'] %>/migrate
  search:
    <<: *sqlite3
    database: storage/<%= ENV['DATABASE'] %>/test_search.sqlite3
    migrations_paths: db/<%= ENV['DATABASE'] %>/search_migrate

production:
  primary:
    <<: *postgresql
    database: <%= ENV['DATABASE'] %>_production
    migrations_paths: db/<%= ENV['DATABASE'] %>/migrate
  search:
    <<: *sqlite3
    database: storage/<%= ENV['DATABASE'] %>/production_search.sqlite3
    migrations_paths: db/<%= ENV['DATABASE'] %>/search_migrate
  cable:
    <<: *postgresql
    database: production_cable
    migrations_paths: db/cable_migrate
  cache:
    <<: *sqlite3
    database: storage/<%= ENV['DATABASE'] %>/production_cache.sqlite3
    migrations_paths: db/<%= ENV['DATABASE'] %>/cache_migrate
  queue:
    <<: *postgresql
    database: production_queue
    migrations_paths: db/queue_migrate

on_premise:
  primary:
    <<: *sqlite3
    database: storage/production.sqlite3
    migrations_paths: db/migrate
  search:
    <<: *sqlite3
    database: storage/production_search.sqlite3
    migrations_paths: db/search_migrate
  cable:
    <<: *sqlite3
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
  cache:
    <<: *sqlite3
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *sqlite3
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
