default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 13 } %>
  connect_timeout: 1
  checkout_timeout: 1
  variables:
    statement_timeout: 5s

development:
  <<: *default
  database: <%= Tenant.name %>_development

test:
  <<: *default
  database: <%= Tenant.name %>_test

production:
  <<: *default
  database: <%= Tenant.name %>_production
  username: <%= Tenant.name %>
  password: <%= ENV['DATABASE_PASSWORD'] %>
