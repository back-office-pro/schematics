sqlite3: &sqlite3
  adapter: sqlite3
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>
  timeout: 5000

development:
  <<: *sqlite3
  database: storage/<%= Tenant.database_name %>/development.sqlite3
  migrations_paths: db/<%= Tenant.database_name %>/migrate

test:
  <<: *sqlite3
  database: storage/<%= Tenant.database_name %>/test.sqlite3
  migrations_paths: db/<%= Tenant.database_name %>/migrate

production:
  <<: *sqlite3
  database: storage/<%= Tenant.database_name %>/production.sqlite3
  migrations_paths: db/<%= Tenant.database_name %>/migrate

on_premise:
  <<: *sqlite3
  database: storage/<%= Tenant.database_name %>/production.sqlite3
  migrations_paths: db/<%= Tenant.database_name %>/migrate
