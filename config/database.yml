default: &default
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>

postgresql: &postgresql
  <<: *default
  adapter: postgresql
  connect_timeout: 1
  checkout_timeout: 1
  variables:
    statement_timeout: <%= ENV.fetch('STATEMENT_TIMEOUT', '5s') %>

sqlite3: &sqlite3
  <<: *default
  adapter: sqlite3
  timeout: 30_000

development:
  primary:
    <<: *postgresql
    database: <%= Tenant.app_name %>_development
  search:
    <<: *postgresql
    database: <%= Tenant.app_name %>_development_search
    migrations_paths: db/search_migrate
  cable:
    <<: *sqlite3
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate
  cache:
    <<: *sqlite3
    database: storage/development_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *sqlite3
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *postgresql
    database: <%= Tenant.app_name %>_test
  search:
    <<: *postgresql
    database: <%= Tenant.app_name %>_test
    migrations_paths: db/search_migrate

production:
  primary:
    <<: *postgresql
    database: <%= Tenant.app_name %>_production
    username: <%= Tenant.app_name %>
    password: <%= Rails.application.credentials.database_password %>
  search:
    <<: *postgresql
    database: <%= Tenant.app_name %>_production_search
    username: <%= Tenant.app_name %>
    password: <%= Rails.application.credentials.database_password %>
    migrations_paths: db/search_migrate
  cable:
    <<: *sqlite3
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
  cache:
    <<: *sqlite3
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *sqlite3
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
