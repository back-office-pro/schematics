version: "3.8"
services:
  db:
    image: postgres:latest
    ports:
      - 5432:5432
    volumes:
      - dbdata:/var/lib/postgresql/data
  redis:
    image: redis:latest
    ports:
      - 6379:6379
  web:
    build:
      context: .
      dockerfile: ./config/docker/Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - db
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
volumes:
  dbdata:
