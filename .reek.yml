detectors:
  IrresponsibleModule:
    enabled: false
  LongParameterList:
    max_params: 5
  TooManyStatements:
    max_statements: 20
    exclude:
      - initialize
      - inherited
      - remove_unused_files
  TooManyInstanceVariables:
    max_instance_variables: 9
  DuplicateMethodCall:
    max_calls: 5
    allow_calls:
      - SecureRandom.uuid
      - element
  RepeatedConditional:
    max_ifs: 15
  TooManyMethods:
    max_methods: 59
  NestedIterators:
    max_allowed_nesting: 3
  BooleanParameter:
    exclude:
      - Component
  ControlParameter:
    exclude:
      - initialize
      - build
      - load
  UtilityFunction:
    public_methods_only: true
    exclude:
      - format
      - default
      - values
      - function
  InstanceVariableAssumption:
    exclude:
      - Specs::Dummy
      - Tokens::Variable
directories:
  app:
    InstanceVariableAssumption:
      enabled: false
    FeatureEnvy:
      enabled: false
    UtilityFunction:
      enabled: false
  config:
    UtilityFunction:
      enabled: false
  spec:
    UtilityFunction:
      enabled: false
exclude_paths:
  - db/migrate
