detectors:
  IrresponsibleModule:
    enabled: false
  LongParameterList:
    max_params: 5
  TooManyStatements:
    max_statements: 17
    exclude:
      - inherited
  TooManyInstanceVariables:
    max_instance_variables: 9
  DuplicateMethodCall:
    max_calls: 10
  RepeatedConditional:
    max_ifs: 15
  TooManyMethods:
    max_methods: 51
  NestedIterators:
    max_allowed_nesting: 3
  BooleanParameter:
    exclude:
      - Component
  Attribute:
    exclude:
      - prefixed
      - inverse_entity
  ControlParameter:
    exclude:
      - initialize
      - build
      - load
  UtilityFunction:
    public_methods_only: true
    exclude:
      - format
      - default
      - values
      - function
  InstanceVariableAssumption:
    exclude:
      - Specs::Dummy
      - Tokens::Variable
directories:
  app:
    InstanceVariableAssumption:
      enabled: false
    FeatureEnvy:
      enabled: false
    UtilityFunction:
      enabled: false
  config:
    UtilityFunction:
      enabled: false
  spec:
    UtilityFunction:
      enabled: false
exclude_paths:
  - db/migrate
  - spec/dummy
