detectors:
  IrresponsibleModule:
    enabled: false
  LongParameterList:
    max_params: 5
  InstanceVariableAssumption:
    enabled: false
  TooManyStatements:
    max_statements: 28
  UncommunicativeModuleName:
    enabled: false
  SubclassedFromCoreClass:
    enabled: false
  Attribute:
    enabled: false
  TooManyInstanceVariables:
    max_instance_variables: 7
  ControlParameter:
    enabled: false
  DuplicateMethodCall:
    max_calls: 8
  RepeatedConditional:
    max_ifs: 15
  ManualDispatch:
    enabled: false
  UncommunicativeMethodName:
    enabled: false
  UtilityFunction:
    enabled: false
  BooleanParameter:
    enabled: false
  TooManyMethods:
    max_methods: 28
  NestedIterators:
    max_allowed_nesting: 3
  UncommunicativeVariableName:
    enabled: false
  UncommunicativeParameterName:
    enabled: false
  FeatureEnvy:
    enabled: false
  DataClump:
    max_copies: 3
exclude_paths:
  - db/migrate
  - spec/dummy
