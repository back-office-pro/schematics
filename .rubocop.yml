plugins:
  - rubocop-capybara
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-thread_safety
  - rubocop-obsession
AllCops:
  TargetRubyVersion: 3.2.8
  NewCops: enable
  DisplayStyleGuide: true
  Exclude:
    - db/migrate/20*
    - db/*schema.rb
    - vendor/**/*
# rubocop
Layout/LineLength:
  Max: 100
Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - constants
    - association
    - public_attribute_macros
    - public_delegate
    - macros
    - public_class_methods
    - initializer
    - public_methods
    - protected_attribute_macros
    - protected_methods
    - private_attribute_macros
    - private_delegate
    - private_methods
Layout/FirstArrayElementLineBreak:
  Enabled: true
Layout/FirstHashElementLineBreak:
  Enabled: true
Layout/FirstMethodArgumentLineBreak:
  Enabled: true
Layout/FirstMethodParameterLineBreak:
  Enabled: true
Layout/MultilineArrayLineBreaks:
  Enabled: true
Layout/MultilineHashKeyLineBreaks:
  Enabled: true
Layout/MultilineMethodParameterLineBreaks:
  Enabled: true
Layout/SingleLineBlockChain:
  Enabled: true
  Exclude:
    - spec/**/*
Layout/EmptyLineBetweenDefs:
  AllowAdjacentOneLineDefs: false
Lint/HeredocMethodCallPosition:
  Enabled: true
Lint/BooleanSymbol:
  Enabled: false
Naming/InclusiveLanguage:
  Enabled: true
Style/AsciiComments:
  Enabled: true
Style/AutoResourceCleanup:
  Enabled: true
Style/ClassMethodsDefinitions:
  Enabled: true
  EnforcedStyle: self_class
Style/CollectionMethods:
  Enabled: true
Style/Copyright:
  Enabled: true
  Notice: '^Copyright .+'
  AutocorrectNotice: |
    Copyright © 2025 Dev & Software. All rights reserved.

    THIS SOFTWARE IS PROPRIETARY AND CONFIDENTIAL. UNAUTHORIZED COPYING, DISTRIBUTION, MODIFICATION,
    REVERSE ENGINEERING, OR DISCLOSURE IS STRICTLY PROHIBITED.
    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT
    NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, AND
    NONINFRINGEMENT.
    IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES, OR OTHER
    LIABILITY ARISING FROM, OUT OF, OR IN CONNECTION WITH THE SOFTWARE OR ITS USE.
  Exclude:
    - app/components/**/*
    - app/views/**/*
    - bin/*
Style/DateTime:
  Enabled: true
Style/ImplicitRuntimeError:
  Enabled: true
Style/IpAddresses:
  Enabled: true
  AllowedAddresses:
    - 127.0.0.1
    - 127.0.0.0
    - 0.0.0.0
    - '::1'
    - '::'
Style/ReturnNil:
  Enabled: true
Style/Send:
  Enabled: true
Style/SingleLineBlockParams:
  Enabled: true
Style/StringHashKeys:
  Enabled: true
  Exclude:
    - spec/**/*
Style/StringMethods:
  Enabled: true
Style/TrailingCommaInBlockArgs:
  Enabled: true
Style/UnlessLogicalOperators:
  Enabled: true
Style/MutableConstant:
  EnforcedStyle: strict
Style/SafeNavigationChainLength:
  Max: 5
Style/Documentation:
  Enabled: false
Style/HashEachMethods:
  AllowedReceivers:
    - enum
    - attribute
Style/EndlessMethod:
  EnforcedStyle: allow_always
Style/RequireOrder:
  Enabled: true
  Exclude:
    - spec/**/*
    - config/boot.rb
    - bin/importmap
    - lib/schematics.rb
    - lib/schematics/commands/*.rb
    - app/controllers/schematics/resources_controller.rb
Metrics/BlockLength:
  AllowedMethods:
    - describe
    - resource
    - after_bundle
    - setup
    - after_initialize
    - put
    - post
    - get
    - context
    - namespace
    - class_eval
    - let
    - configure
    - class_methods
    - included
    - to_prepare
    - it
    - each
    - define!
    - map_array
    - map_values
    - draw
    - constraints
Metrics/MethodLength:
  Max: 35
  AllowedMethods:
    - inherited
    - fill_form
  CountAsOne:
    - array
    - hash
    - heredoc
Metrics/AbcSize:
  Max: 50
# rubocop-rspec
RSpec/DescribedClassModuleWrapping:
  Enabled: true
RSpec/Dialect:
  Enabled: true
RSpec/MessageExpectation:
  Enabled: true
RSpec/ExampleLength:
  CountAsOne:
    - array
    - hash
    - heredoc
    - method_call
RSpec/MultipleMemoizedHelpers:
  Max: 18
RSpec/EmptyExampleGroup:
  Exclude:
    - spec/schematics/*
    - spec/*/active_storage/**/*
    - spec/*/core/**/*
RSpec/SpecFilePathFormat:
  Exclude:
    - spec/lib/active_record/connection_adapters/sqlite3_adapter_spec.rb
    - spec/lib/bootstrap-email/config_spec.rb
    - spec/lib/onelogin/ruby-saml/settings_spec.rb
RSpec/DescribeClass:
  Exclude:
    - spec/db/migrate/*
    - spec/generators/app/templates/**/*
    - spec/lib/templates/**/*
RSpec/RemoveConst:
  Exclude:
    - spec/interactors/core/migrations/migrate_spec.rb
RSpec/InstanceVariable:
  AssignmentOnly: true
# rubocop-rails
Rails/SaveBang:
  Enabled: true
Rails/DefaultScope:
  Enabled: true
Rails/OrderById:
  Enabled: true
Rails/PluckId:
  Enabled: true
Rails/RequireDependency:
  Enabled: true
Rails/ReversibleMigrationMethodDefinition:
  Enabled: true
Rails/TableNameAssignment:
  Enabled: true
Rails/Inquiry:
  Enabled: false
Rails/UnknownEnv:
  Environments:
    - production
    - development
    - test
# rubocop-performance
Performance/MethodObjectAsBlock:
  Enabled: false
Performance/MapMethodChain:
  Enabled: false
# rubocop-capybara
Capybara/ClickLinkOrButtonStyle:
  EnforcedStyle: strict
# rubocop-obsession
Obsession/Rails/ValidationMethodName:
  Enabled: false
Obsession/Rails/MigrationBelongsTo:
  Enabled: false
# rubocop-thread_safety
ThreadSafety/DirChdir:
  AllowCallWithBlock: true
