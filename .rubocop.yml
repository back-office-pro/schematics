require:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
Layout/DotPosition:
  Enabled: true
  EnforcedStyle: leading
Layout/EmptyLineAfterGuardClause:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/GuardClause:
  Enabled: true
Style/IfUnlessModifier:
  Enabled: true
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma
Style/FrozenStringLiteralComment:
  Enabled: false
Layout/LineLength:
  Max: 100
RSpec/ExampleLength:
  Enabled: false
Metrics/BlockLength:
  IgnoredMethods:
    - describe
    - resource
    - after_bundle
    - setup
    - after_initialize
    - put
    - context
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
RSpec/MultipleExpectations:
  Max: 2
Metrics/CyclomaticComplexity:
  Max: 8
Metrics/AbcSize:
  Enabled: false
Metrics/ParameterLists:
  Max: 7
Performance/MethodObjectAsBlock:
  Enabled: false
AllCops:
  TargetRubyVersion: 3.0.0
  NewCops: enable
  Exclude:
    - spec/dummy/**/*
