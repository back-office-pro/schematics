require:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
Style/Documentation:
  Enabled: false
Style/ReturnNil:
  Enabled: true
Style/Send:
  Enabled: false # TODO: enable
Rails/SaveBang:
  Enabled: true
Style/HashEachMethods:
  AllowedReceivers:
    - enum
    - attribute
Layout/LineLength:
  Max: 100
RSpec/ExampleLength:
  Max: 15
Metrics/BlockLength:
  IgnoredMethods:
    - describe
    - resource
    - after_bundle
    - setup
    - after_initialize
    - put
    - post
    - get
    - context
    - namespace
    - class_eval
    - let
    - configure
    - class_methods
Metrics/MethodLength:
  Max: 50
  IgnoredMethods:
    - inherited
Metrics/ClassLength:
  Max: 300
Metrics/ModuleLength:
  Max: 101
RSpec/MultipleExpectations:
  Max: 2
Metrics/AbcSize:
  Max: 70
Metrics/ParameterLists:
  Max: 9
Performance/MethodObjectAsBlock:
  Enabled: false
AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - spec/dummy/**/*
    - vendor/**/*
