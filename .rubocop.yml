require:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-thread_safety
AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - spec/dummy/**/*
    - vendor/**/*
# rubocop
Layout/LineLength:
  Max: 100
Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - constants
    - association
    - public_attribute_macros
    - public_delegate
    - macros
    - public_class_methods
    - initializer
    - public_methods
    - protected_attribute_macros
    - protected_methods
    - private_attribute_macros
    - private_delegate
    - private_methods
Layout/FirstArrayElementLineBreak:
  Enabled: true
Layout/FirstHashElementLineBreak:
  Enabled: true
Layout/FirstMethodArgumentLineBreak:
  Enabled: true
Layout/FirstMethodParameterLineBreak:
  Enabled: true
Layout/MultilineArrayLineBreaks:
  Enabled: true
Layout/MultilineHashKeyLineBreaks:
  Enabled: true
Lint/HeredocMethodCallPosition:
  Enabled: true
Naming/InclusiveLanguage:
  Enabled: true
Style/AsciiComments:
  Enabled: true
Style/AutoResourceCleanup:
  Enabled: true
Style/ClassMethodsDefinitions:
  Enabled: true
  EnforcedStyle: self_class
Style/CollectionMethods:
  Enabled: true
Style/DateTime:
  Enabled: true
Style/ImplicitRuntimeError:
  Enabled: true
Style/IpAddresses:
  Enabled: true
  AllowedAddresses:
    - 127.0.0.1
    - '::1'
Style/MethodCalledOnDoEndBlock:
  Enabled: true
Style/ReturnNil:
  Enabled: true
Style/Send:
  Enabled: false # TODO: enable
Style/SingleLineBlockParams:
  Enabled: true
Style/StringHashKeys:
  Enabled: false # TODO: enable
Style/StringMethods:
  Enabled: true
Style/TrailingCommaInBlockArgs:
  Enabled: true
Style/UnlessLogicalOperators:
  Enabled: true
Style/MutableConstant:
  EnforcedStyle: strict
Style/Documentation:
  Enabled: false
Style/RescueModifier:
  Enabled: false
Style/HashEachMethods:
  AllowedReceivers:
    - enum
    - attribute
Metrics/BlockLength:
  IgnoredMethods:
    - describe
    - resource
    - after_bundle
    - setup
    - after_initialize
    - put
    - post
    - get
    - context
    - namespace
    - class_eval
    - let
    - configure
    - class_methods
    - included
    - to_prepare
Metrics/MethodLength:
  Max: 50
  IgnoredMethods:
    - inherited
Metrics/ClassLength:
  Max: 300
Metrics/ModuleLength:
  Max: 105
Metrics/AbcSize:
  Max: 70
Metrics/ParameterLists:
  Max: 9
# rubocop-rspec
RSpec/DescribedClassModuleWrapping:
  Enabled: true
RSpec/Dialect:
  Enabled: true
RSpec/MessageExpectation:
  Enabled: true
RSpec/ExampleLength:
  Max: 15
# rubocop-rails
Rails/SaveBang:
  Enabled: true
Rails/DefaultScope:
  Enabled: true
Rails/OrderById:
  Enabled: true
Rails/PluckId:
  Enabled: true
Rails/RequireDependency:
  Enabled: true
Rails/ReversibleMigrationMethodDefinition:
  Enabled: true
# rubocop-performance
Performance/MethodObjectAsBlock:
  Enabled: false
