one:
  state: pending
  data:
    - id: <%= SecureRandom.uuid %>
      name: client
      options:
        icon: user_tie
        descriptor: full_name
      virtuals:
        - name: full_name
          function: $first_name $last_name
        - name: name_error
          function: $foo + $bar
        - name: type_error
          function: $first_name * $last_name
        - name: no_method_error
          function: $first_name.some_attribute
        - name: malformed_virtual
          function: $first_name = true
      attributes:
        - id: <%= SecureRandom.uuid %>
          name: first_name
          type: string
          options:
            required: true
        - id: <%= SecureRandom.uuid %>
          name: last_name
          type: string
          options:
            required: true
        - id: <%= SecureRandom.uuid %>
          name: age
          type: float
    - id: <%= SecureRandom.uuid %>
      name: sub_category
      options:
        icon: box
        descriptor: designation
      attributes:
        - id: <%= SecureRandom.uuid %>
          name: designation
          type: string
          options:
            unique: true
        - id: <%= SecureRandom.uuid %>
          name: category
          type: belongs_to
          options:
            required: true
    - id: <%= SecureRandom.uuid %>
      name: category
      options:
        icon: box
        descriptor: label
      triggers:
        - action: before_save
          callback: $error.foo = true
      attributes:
        - id: <%= SecureRandom.uuid %>
          name: label
          type: string
          options:
            unique: true
            required: true
        - id: <%= SecureRandom.uuid %>
          name: preview
          type: attachment
          options:
            content_type:
              - png
    - id: <%= SecureRandom.uuid %>
      name: product
      options:
        descriptor: reference
      virtuals:
        - name: tax_inclusive_price
          function: $price * (1 + $vat / 100)
          options:
            precision: 2
            unit: €
        - name: big_price
          function: $price > 100 && $vat >= 10
        - name: reference
          function: ref-$id-$sub_category.id
      attributes:
        - id: <%= SecureRandom.uuid %>
          name: designation
          type: string
          options:
            unique: true
            required: true
            limit: 100
        - id: <%= SecureRandom.uuid %>
          name: description
          type: string
        - id: <%= SecureRandom.uuid %>
          name: price
          type: currency
          options:
            precision: 2
            unit: €
        - id: <%= SecureRandom.uuid %>
          name: vat
          type: percentage
          options:
            precision: 1
            default: 19.6
        - id: <%= SecureRandom.uuid %>
          name: in_stock
          type: boolean
          options:
            default: false
        - id: <%= SecureRandom.uuid %>
          name: quantity
          type: integer
          options:
            default: 20
        - id: <%= SecureRandom.uuid %>
          name: rating
          type: rating
        - id: <%= SecureRandom.uuid %>
          name: logo
          type: attachment
          options:
            required: true
            content_type:
              - pdf
            size: 1
        - id: <%= SecureRandom.uuid %>
          name: state
          type: state_machine
          options:
            required: true
            default: pending
            values:
              - pending
              - closed
              - refused
            events:
              - name: close
                icon: xmark
                from: pending
                to: closed
                callback: $in_stock = false
              - name: refuse
                icon: ban
                from: pending
                to: refused
                callback: $error.foo = true
              - name: reopen
                from:
                  - closed
                  - refused
                to: pending
                callback: $in_stock = true
        - id: <%= SecureRandom.uuid %>
          name: sub_category
          type: belongs_to
          options:
            required: true
    - id: <%= SecureRandom.uuid %>
      name: order
      virtuals:
        - name: reference
          function: ORDER-$product.id
      attributes:
        - id: <%= SecureRandom.uuid %>
          name: title
          type: text
        - id: <%= SecureRandom.uuid %>
          name: country
          type: country
        - id: <%= SecureRandom.uuid %>
          name: start_at
          type: datetime
          options:
            required: true
            less_than: ends_at
        - id: <%= SecureRandom.uuid %>
          name: ends_at
          type: datetime
          options:
            required: true
            greater_than: start_at
        - id: <%= SecureRandom.uuid %>
          name: invoices
          type: attachments
        - id: <%= SecureRandom.uuid %>
          name: product
          type: belongs_to
    - id: <%= SecureRandom.uuid %>
      name: stock_movement
      options:
        icon: people_carry_box
        actions:
          - index
          - show
          - create
          - destroy
      triggers:
        - action: after_create
          callback: $product.quantity -= quantity
        - action: after_destroy
          callback: $product.quantity += quantity
      attributes:
        - id: <%= SecureRandom.uuid %>
          name: quantity
          type: integer
        - id: <%= SecureRandom.uuid %>
          name: product
          type: belongs_to
          options:
            required: true
