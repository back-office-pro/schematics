---
one:
  model: User
  content: |
    <table>
      <tbody>
        <tr>
          <th>{{ email }}</th>
          <td>{{ first_name }}</td>
          <td>{{ last_name }}</td>
          <td>{{ role.name }}</td>
          <td>
            {% for team in teams %}
              {{ team.name }}
            {% endfor %}
          </td>
        </tr>
      </tbody>
    </table>
